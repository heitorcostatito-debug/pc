name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080
    
    steps:
      - name: Baixar e executar AnyDesk
        run: |
          # Baixar AnyDesk (versão portátil)
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          
          # Iniciar AnyDesk diretamente (sem instalar)
          Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--start-with-win"
          
          # Aguardar iniciar
          Start-Sleep -Seconds 10
          
          # Mostrar ID
          Write-Host "========================================="
          Write-Host "ID DO ANYDESK:"
          .\AnyDesk.exe --get-id
          Write-Host "========================================="
          Write-Host "SENHA: 123456"
          .\AnyDesk.exe --set-password "123456"
          Write-Host "========================================="
          
          # Manter rodando
          while ($true) {
            Start-Sleep -Seconds 600
          }
