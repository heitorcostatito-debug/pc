name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080
    
    steps:
      - name: Instalar AnyDesk
        run: |
          # Baixar AnyDesk
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          
          # Instalar (COM O CAMINHO CORRETO)
          .\AnyDesk.exe --silent --install "C:\Program Files (x86)\AnyDesk" --start-with-win
          
          # Aguardar instalação
          Start-Sleep -Seconds 15
          
          # Iniciar AnyDesk
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          # Mostrar ID
          Write-Host "========================================="
          Write-Host "ID DO ANYDESK:"
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --get-id
          Write-Host "========================================="
          
          # Definir senha
          & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password "123456"
          Write-Host "SENHA: 123456"
          Write-Host "========================================="
          
          # Manter rodando
          while ($true) {
            Start-Sleep -Seconds 3600
          }          # Manter ativo
          while ($true) {
            $proc = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $proc) {
              Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
            }
            Start-Sleep -Seconds 600
          }
